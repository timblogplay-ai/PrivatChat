<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TmChat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ПОДКЛЮЧАЕМ БИБЛИОТЕКУ PEERJS ДЛЯ ЗВОНКОВ -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-color: #07070d; --panel-bg: rgba(18, 18, 30, 0.6); --border-color: rgba(255, 255, 255, 0.08);
    --accent: #a855f7; --accent-2: #22d3ee; --my-msg-bg: linear-gradient(135deg, var(--accent), var(--accent-2));
    --his-msg-bg: rgba(255, 255, 255, 0.05); --text-main: #e6e6f0; --text-muted: #8a8aa5;
  }
  body.light-mode {
    --bg-color: #f0f2f5; --panel-bg: rgba(255, 255, 255, 0.8); --border-color: rgba(0, 0, 0, 0.1);
    --his-msg-bg: rgba(0, 0, 0, 0.05); --text-main: #111827; --text-muted: #6b7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh;
    display: flex; overflow: hidden; transition: background 0.3s, color 0.3s;
    background-image: radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.15), transparent 25%);
  }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

  /* Вход */
  .auth-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(7, 7, 13, 0.8); backdrop-filter: blur(20px); transition: opacity 0.4s; }
  .auth-screen.hidden { opacity: 0; visibility: hidden; }
  .auth-box { background: var(--panel-bg); padding: 50px 40px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid var(--border-color); text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
  .auth-box h2 { font-size: 28px; font-weight: 700; margin-bottom: 12px; background: var(--my-msg-bg); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-box p { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; }
  .google-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #fff; color: #333; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.2s; }
  .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,255,255,0.2); }

  /* Приложение */
  .app-container { display: flex; width: 100%; height: 100%; opacity: 0; transition: opacity 0.4s; }
  .app-container.active { opacity: 1; }

  /* Сайдбар */
  .sidebar { width: 340px; flex-shrink: 0; background: var(--panel-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; transition: 0.3s; }
  .sidebar-header { padding: 24px 24px 15px; display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h1 { font-size: 20px; font-weight: 700; }
  .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent); padding: 2px; cursor: pointer; transition: 0.3s; }
  .user-info img:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--accent); }
  .search-container { padding: 0 20px 15px; border-bottom: 1px solid var(--border-color); }
  .search-container input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; color: var(--text-main); outline: none; }
  .search-container input:focus { border-color: var(--accent); }
  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; border-radius: 16px; margin-bottom: 8px; border: 1px solid transparent; transition: 0.2s; }
  .chat-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(4px); }
  .chat-avatar { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; background: var(--my-msg-bg); flex-shrink: 0; }
  .chat-info { flex: 1; overflow: hidden; }
  .chat-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .chat-info p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; margin-left: 5px; }
  .offline-dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; display: inline-block; margin-left: 5px; }

  /* Чат */
  .main-chat { flex: 1; display: flex; flex-direction: column; background: transparent; position: relative; min-width: 0; }
  .chat-header { padding: 15px 20px; background: var(--panel-bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; z-index: 5; flex-shrink: 0; }
  .chat-header h2 { font-size: 18px; font-weight: 600; }
  .status-text { font-size: 12px; color: var(--accent-2); font-weight: 500; }
  .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .message-container { display: flex; flex-direction: column; max-width: 75%; position: relative; animation: popIn 0.3s forwards; }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .message-container.my { align-self: flex-end; }
  .message-container.his { align-self: flex-start; }
  .message { padding: 14px 20px; border-radius: 20px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; }
  .my .message { background: var(--my-msg-bg); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2); }
  .his .message { background: var(--his-msg-bg); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
  .reply-block { background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; cursor: pointer; opacity: 0.8; }
  .reply-block b { display: block; color: var(--accent-2); margin-bottom: 2px; }
  .message .time { font-size: 11px; opacity: 0.6; float: right; margin: 6px 0 -4px 12px; }
  .msg-actions { position: absolute; top: -10px; right: 0; display: none; gap: 5px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 2; }
  .message-container:hover .msg-actions { display: flex; }
  .msg-actions button { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 4px 8px; border-radius: 6px; }
  .msg-actions button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .msg-actions button.delete:hover { color: #ef4444; }
  .typing-indicator { font-size: 12px; color: var(--text-muted); margin: 0 20px; height: 20px; font-style: italic; opacity: 0; transition: opacity 0.3s; flex-shrink: 0; }
  .msg-media { max-width: 100%; border-radius: 10px; margin-bottom: 5px; cursor: pointer; display: block; }
  .msg-file { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-decoration: none; color: var(--text-main); font-size: 14px; margin-bottom: 5px; }

  /* Ввод */
  .input-container { position: relative; background: var(--panel-bg); backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); padding: 12px 20px; display: flex; flex-direction: column; flex-shrink: 0; }
  .reply-preview { display: none; background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent); padding: 8px; margin-bottom: 10px; border-radius: 6px; position: relative; font-size: 13px; }
  .reply-preview.active { display: block; }
  .reply-preview .close-reply { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-weight: bold; }
  .input-row { display: flex; gap: 10px; align-items: center; }
  .attach-btn, .emoji-btn, .call-btn { background: none; border: none; font-size: 22px; cursor: pointer; flex-shrink: 0; color: var(--text-muted); }
  .input-area { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; color: var(--text-main); outline: none; font-size: 15px; width: 100%; }
  .input-area:focus { border-color: var(--accent); }
  .send-btn { background: var(--my-msg-bg); color: #fff; border: none; border-radius: 16px; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Эмодзи */
  .emoji-panel { display: none; position: absolute; bottom: 80px; left: 20px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); grid-template-columns: repeat(5, 1fr); gap: 5px; z-index: 50; }
  .emoji-panel.active { display: grid; }
  .emoji-panel span { font-size: 24px; cursor: pointer; padding: 5px; border-radius: 8px; text-align: center; }

  /* Модалки */
  .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .profile-modal { background: var(--bg-color); border: 1px solid var(--border-color); width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; border-radius: 24px; padding: 30px; transform: translateY(20px); transition: 0.3s; }
  .modal-overlay.active .profile-modal { transform: translateY(0); }
  .close-modal { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 24px; }
  .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 25px; }
  .profile-header img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 12px; }
  .profile-header h3 { font-size: 20px; font-weight: 700; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; color: var(--text-main); outline: none; }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }
  .btn-save { width: 100%; padding: 14px; border-radius: 12px; background: var(--my-msg-bg); color: #fff; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; margin-bottom: 10px; }
  .btn-logout { width: 100%; padding: 14px; border-radius: 12px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 600; cursor: pointer; }
  .admin-user-list { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
  .admin-user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
  .admin-user-item button { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

  .back-btn { display: none; }

  /* Окно звонка */
  .call-modal { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
  .call-modal.active { opacity: 1; pointer-events: auto; }
  .call-avatar { width: 120px; height: 120px; border-radius: 50%; background: var(--my-msg-bg); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; color: #fff; margin-bottom: 20px; box-shadow: 0 0 30px var(--accent); }
  .call-name { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
  .call-status { font-size: 16px; color: var(--text-muted); margin-bottom: 40px; }
  .call-actions { display: flex; gap: 30px; }
  .call-btn-action { width: 70px; height: 70px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; transition: 0.2s; }
  .call-btn-action.accept { background: #4ade80; }
  .call-btn-action.reject { background: #ef4444; }
  .call-btn-action.end { background: #ef4444; }
  .call-btn-action:hover { transform: scale(1.1); }

  @media (max-width: 768px) {
    .sidebar { position: absolute; width: 100%; height: 100%; border-right: none; }
    .sidebar.hidden { transform: translateX(-100%); }
    .main-chat { width: 100%; }
    .back-btn { display: flex; background: rgba(255,255,255,0.1); border: none; color: var(--text-main); font-size: 20px; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; align-items: center; justify-content: center; flex-shrink: 0; }
    .message-container { max-width: 90%; }
    .chat-header { padding: 10px 15px; gap: 10px; }
    .chat-header h2 { font-size: 16px; }
    .input-container { padding: 10px 15px; }
    .attach-btn, .emoji-btn, .call-btn { font-size: 20px; }
    .input-area { padding: 12px 14px; font-size: 14px; }
    .send-btn { width: 44px; height: 44px; }
    .profile-modal { padding: 20px; width: 90%; }
    .call-avatar { width: 100px; height: 100px; font-size: 40px; }
  }
</style>
</head>
<body>

  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>TmChat</h2>
      <p>Твой безопасный мессенджер</p>
      <button class="google-btn" id="googleLoginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Войти через Google
      </button>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>TmChat</h1>
        <div class="user-info">
          <img id="myAvatar" src="" alt="Avatar" title="Открыть профиль">
        </div>
      </div>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Найти друга..." autocomplete="off">
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat" id="mainChat">
      <div class="no-chat" id="noChat" style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-muted);">
        Выбери друга для общения
      </div>
      
      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="back-btn" id="backBtn">←</button>
        <div class="chat-avatar" id="headerAvatar" style="width:40px;height:40px;font-size:16px;border-radius:12px;"></div>
        <div style="flex:1; overflow:hidden;">
          <h2 id="headerName" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h2>
          <div class="status-text" id="headerStatus"></div>
        </div>
        <!-- КНОПКА ЗВОНКА -->
        <button class="call-btn" id="callBtn" title="Позвонить">📞</button>
      </div>
      
      <div class="messages-area" id="messagesArea" style="display:none;"></div>
      <div class="typing-indicator" id="typingIndicator" style="display:none;">печатает...</div>
      
      <div class="input-container" id="inputContainer" style="display:none;">
        <div class="reply-preview" id="replyPreview">
          <b id="replyName"></b> <span id="replyText"></span> <span class="close-reply" id="closeReply">×</span>
        </div>
        <div class="emoji-panel" id="emojiPanel">
          <span>😀</span><span>😂</span><span>🥰</span><span>😎</span><span>😭</span>
          <span>👍</span><span>🔥</span><span>💎</span><span>❤️</span><span>🎮</span>
          <span>⛏️</span><span>💀</span><span>🤔</span><span>😡</span><span>🥶</span>
        </div>
        <div class="input-row">
          <button class="attach-btn" id="attachBtn" title="Прикрепить файл">📎</button>
          <input type="file" id="fileInput" style="display: none;">
          <button class="emoji-btn" id="emojiBtn">😀</button>
          <input type="text" id="msgInput" class="input-area" placeholder="Сообщение..." autocomplete="off">
          <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА ПРОФИЛЯ -->
  <div class="modal-overlay" id="profileModal">
    <div class="profile-modal">
      <button class="close-modal" id="closeProfileModal">×</button>
      <div class="profile-header">
        <img id="profileAvatar" src="" alt="Avatar">
        <h3 id="profileName">Загрузка...</h3>
      </div>
      <div class="form-group"><label>Имя в чате</label><input type="text" id="settingsName" placeholder="Никнейм"></div>
      <div class="form-group"><label>Статус</label><input type="text" id="settingsStatus" placeholder="Играю в Minecraft"></div>
      <div class="toggle-row"><span>Светлая тема</span><label class="switch"><input type="checkbox" id="themeToggle"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Не беспокоить</span><label class="switch"><input type="checkbox" id="dndToggle"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Вид как на ПК (десктоп)</span><label class="switch"><input type="checkbox" id="forceDesktopToggle"><span class="slider"></span></label></div>
      <button class="btn-save" id="saveProfileBtn">Сохранить</button>
      <button id="openAdminBtn" style="width:100%; background:none; border:none; color:var(--text-muted); font-size:12px; margin-top:15px; cursor:pointer; text-decoration:underline;">Админ-панель</button>
      <button class="btn-logout" id="logoutBtn" style="margin-top:10px;">Выйти</button>
    </div>
  </div>

  <!-- МОДАЛКА АДМИНКИ -->
  <div class="modal-overlay" id="adminModal">
    <div class="profile-modal">
      <button class="close-modal" id="closeAdminModal">×</button>
      <h2 style="text-align:center; margin-bottom:20px; color:#ef4444;">Админ-панель</h2>
      <div id="adminAuthSection">
        <div class="form-group"><label>Введите пароль администратора</label><input type="password" id="adminPasswordInput" placeholder="••••••••"></div>
        <button class="btn-save" id="adminLoginBtn" style="background:#ef4444;">Войти</button>
      </div>
      <div id="adminContentSection" style="display:none;">
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Список всех аккаунтов:</p>
        <div class="admin-user-list" id="adminUserList"></div>
      </div>
    </div>
  </div>

  <!-- ОКНО ЗВОНКА -->
  <div class="call-modal" id="callModal">
    <div class="call-avatar" id="callAvatar">?</div>
    <div class="call-name" id="callName">Пользователь</div>
    <div class="call-status" id="callStatus">Звонок...</div>
    <div class="call-actions" id="callActions">
      <!-- Кнопки будут добавлены через JS -->
    </div>
    <audio id="remoteAudio" autoplay></audio>
  </div>

<script type="module">

  const app = initializeApp(firebaseConfig);

  let currentUser = null, activeChatId = null, activeFriend = null;
  let unsubscribeMessages = null, unsubscribeTyping = null;
  let allUsersData = {}, replyTo = null, lastMsgCount = 0, typingTimeout = null;

  // ==== ЗВОНКИ (PEERJS) ====
  let peer = null;
  let currentCall = null;
  let localStream = null;

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;
  function playSound() {
    if (localStorage.getItem('tm_dnd') === 'true') return;
    if (!audioCtx) audioCtx = new AudioContext();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }

  function sendNotification(title, body) {
    if (localStorage.getItem('tm_dnd') === 'true') return;
    if (Notification.permission === "granted" && document.hidden) new Notification(title, { body: body });
  }
  document.addEventListener('click', () => { if (Notification.permission === "default") Notification.requestPermission(); }, { once: true });

  if (localStorage.getItem('tm_light_theme') === 'true') document.body.classList.add('light-mode');
  if (localStorage.getItem('tm_dnd') === 'true') document.getElementById('dndToggle').checked = true;
  if (localStorage.getItem('tm_force_desktop') === 'true') {
    document.getElementById('forceDesktopToggle').checked = true;
    document.querySelector('style').innerHTML += `@media (max-width: 768px) { .sidebar { position: relative !important; width: 340px !important; transform: none !important; } .sidebar.hidden { transform: translateX(-100%) !important; } .main-chat { width: calc(100% - 340px) !important; } .back-btn { display: none !important; } }`;
  }

  document.getElementById('themeToggle').addEventListener('change', (e) => {
    if (e.target.checked) { document.body.classList.add('light-mode'); localStorage.setItem('tm_light_theme', 'true'); }
    else { document.body.classList.remove('light-mode'); localStorage.setItem('tm_light_theme', 'false'); }
  });
  document.getElementById('dndToggle').addEventListener('change', (e) => localStorage.setItem('tm_dnd', e.target.checked ? 'true' : 'false'));
  document.getElementById('forceDesktopToggle').addEventListener('change', (e) => { localStorage.setItem('tm_force_desktop', e.target.checked ? 'true' : 'false'); location.reload(); });

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    const provider = new GoogleAuthProvider();
    try { await signInWithPopup(auth, provider); } catch (e) { alert(e.message); }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('tm_friends');
    if (currentUser) set(ref(db, 'users/' + currentUser.uid + '/status'), 'Оффлайн');
    if (peer) peer.destroy();
    signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.add('active');
      document.getElementById('myAvatar').src = user.photoURL;
      document.getElementById('profileAvatar').src = user.photoURL;
      const userRef = ref(db, 'users/' + user.uid);
      set(userRef, { name: user.displayName || user.email.split('@')[0], photo: user.photoURL, status: 'В сети' }, { merge: true });
      onDisconnect(userRef).update({ status: 'Был(а) недавно', lastSeen: serverTimestamp() });
      
      initPeer();
      loadAllUsers();
    } else {
      currentUser = null;
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('appContainer').classList.remove('active');
      if (peer) peer.destroy();
    }
  });

  // ==== ИНИЦИАЛИЗАЦИЯ PEERJS ====
  function initPeer() {
    // Используем Firebase UID как уникальный Peer ID (добавляем префикс для надежности)
    peer = new Peer('tm_' + currentUser.uid);

    peer.on('open', (id) => {
      console.log('PeerJS подключен. Мой ID:', id);
    });

    peer.on('error', (err) => {
      console.error('Ошибка PeerJS:', err);
    });

    // ВХОДЯЩИЙ ЗВОНОК
    peer.on('call', (call) => {
      playSound();
      sendNotification('Входящий звонок', 'Вам звонит пользователь...');
      
      const callerId = call.peer.replace('tm_', '');
      const callerName = allUsersData[callerId]?.name || 'Пользователь';

      document.getElementById('callAvatar').textContent = callerName[0].toUpperCase();
      document.getElementById('callName').textContent = callerName;
      document.getElementById('callStatus').textContent = 'Входящий звонок...';
      
      const actions = document.getElementById('callActions');
      actions.innerHTML = `
        <button class="call-btn-action accept" id="acceptCallBtn">✅</button>
        <button class="call-btn-action reject" id="rejectCallBtn">❌</button>
      `;
      
      document.getElementById('callModal').classList.add('active');

      document.getElementById('acceptCallBtn').onclick = async () => {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          call.answer(localStream);
          currentCall = call;
          setupCallEvents(call);
          document.getElementById('callStatus').textContent = 'Разговор...';
          actions.innerHTML = `<button class="call-btn-action end" id="endCallBtn">📴</button>`;
          document.getElementById('endCallBtn').onclick = endCall;
        } catch (e) {
          alert("Не удалось получить доступ к микрофону.");
          call.close();
          document.getElementById('callModal').classList.remove('active');
        }
      };

      document.getElementById('rejectCallBtn').onclick = () => {
        call.close();
        document.getElementById('callModal').classList.remove('active');
      };
    });
  }

  // ИСХОДЯЩИЙ ЗВОНОК
  document.getElementById('callBtn').onclick = async () => {
    if (!activeFriend) return;
    
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      const friendPeerId = 'tm_' + activeFriend;
      const call = peer.call(friendPeerId, localStream);
      currentCall = call;

      document.getElementById('callAvatar').textContent = document.getElementById('headerName').textContent[0].toUpperCase();
      document.getElementById('callName').textContent = document.getElementById('headerName').textContent;
      document.getElementById('callStatus').textContent = 'Вызов...';
      
      const actions = document.getElementById('callActions');
      actions.innerHTML = `<button class="call-btn-action end" id="endCallBtn">📴</button>`;
      document.getElementById('endCallBtn').onclick = endCall;
      
      document.getElementById('callModal').classList.add('active');

      setupCallEvents(call);
    } catch (e) {
      alert("Не удалось получить доступ к микрофону.");
    }
  };

  function setupCallEvents(call) {
    call.on('stream', (remoteStream) => {
      const audio = document.getElementById('remoteAudio');
      audio.srcObject = remoteStream;
      audio.play().catch(e => console.log("Autoplay blocked:", e));
    });

    call.on('close', () => {
      endCall();
    });
    
    call.on('error', (err) => {
      console.error('Ошибка звонка:', err);
      endCall();
    });
  }

  function endCall() {
    if (currentCall) {
      currentCall.close();
      currentCall = null;
    }
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    document.getElementById('remoteAudio').srcObject = null;
    document.getElementById('callModal').classList.remove('active');
  }

  // ==== ДАЛЬШЕ ИДЕТ СТАРЫЙ КОД (СПИСОК, ЧАТ, ФАЙЛЫ И Т.Д.) ====
  function loadAllUsers() {
    onValue(ref(db, 'users'), (snapshot) => {
      allUsersData = snapshot.val() || {};
      renderSavedFriends();
      if (activeFriend && allUsersData[activeFriend]) {
        document.getElementById('headerStatus').textContent = allUsersData[activeFriend].status || 'В сети';
      }
      if (document.getElementById('adminContentSection').style.display === 'block') renderAdminUserList();
    });
  }

  function renderSavedFriends() {
    const list = document.getElementById('chatList');
    const friends = JSON.parse(localStorage.getItem('tm_friends') || '[]');
    if (friends.length === 0) { list.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:14px; padding:20px;">Найди друга через поиск!</div>'; return; }
    list.innerHTML = '';
    friends.forEach(uid => {
      if (allUsersData[uid]) {
        const u = allUsersData[uid];
        const isOnline = u.status === 'В сети' || u.status === 'Онлайн';
        const div = document.createElement('div'); div.className = 'chat-item';
        div.innerHTML = `<div class="chat-avatar">${u.name[0].toUpperCase()}</div><div class="chat-info"><h3>${u.name} <span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span></h3><p>${u.status || 'Был(а) недавно'}</p></div>`;
        div.onclick = () => openChat(uid, u.name, u.status);
        list.appendChild(div);
      }
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    const list = document.getElementById('chatList');
    if (query === '') return renderSavedFriends();
    const results = Object.keys(allUsersData).filter(uid => {
      if (uid === currentUser.uid) return false;
      const u = allUsersData[uid];
      return (u.name && u.name.toLowerCase().includes(query));
    });
    list.innerHTML = '';
    if (results.length === 0) list.innerHTML = '<div style="text-align:center; padding:20px;">Не найдено</div>';
    results.forEach(uid => {
      const u = allUsersData[uid];
      const div = document.createElement('div'); div.className = 'chat-item';
      div.innerHTML = `<div class="chat-avatar">${u.name[0].toUpperCase()}</div><div class="chat-info"><h3>${u.name}</h3></div>`;
      div.onclick = () => openChat(uid, u.name, u.status);
      list.appendChild(div);
    });
  });

  function openChat(friendUid, friendName, friendStatus) {
    let friends = JSON.parse(localStorage.getItem('tm_friends') || '[]');
    if (!friends.includes(friendUid)) { friends.push(friendUid); localStorage.setItem('tm_friends', JSON.stringify(friends)); }
    document.getElementById('searchInput').value = '';
    activeFriend = friendUid;
    activeChatId = [currentUser.uid, friendUid].sort().join('_');
    if (window.innerWidth <= 768 && localStorage.getItem('tm_force_desktop') !== 'true') document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('noChat').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('messagesArea').style.display = 'flex';
    document.getElementById('inputContainer').style.display = 'flex';
    document.getElementById('headerName').textContent = friendName;
    document.getElementById('headerStatus').textContent = friendStatus || 'В сети';
    document.getElementById('headerAvatar').textContent = friendName[0].toUpperCase();
    document.getElementById('msgInput').focus();
    document.getElementById('replyPreview').classList.remove('active');

    if (unsubscribeMessages) unsubscribeMessages();
    if (unsubscribeTyping) unsubscribeTyping();

    onValue(ref(db, 'messages/' + activeChatId), (snapshot) => {
      const msgs = snapshot.val();
      const area = document.getElementById('messagesArea');
      const isScrolledToBottom = area.scrollHeight - area.clientHeight <= area.scrollTop + 150;
      let currentCount = 0; area.innerHTML = '';
      if (msgs) {
        Object.keys(msgs).forEach(key => {
          const m = msgs[key]; currentCount++;
          const div = document.createElement('div');
          div.className = `message-container ${m.sender === currentUser.uid ? 'my' : 'his'}`;
          let replyHtml = m.replyTo ? `<div class="reply-block"><b>${m.replyTo.name}</b>${m.replyTo.text}</div>` : '';
          let actionsHtml = `<div class="msg-actions"><button class="reply" data-id="${key}" data-text="${m.text || 'Медиафайл'}" data-sender="${m.sender}">Ответить</button>${m.sender === currentUser.uid ? `<button class="delete" data-id="${key}">Удалить</button>` : ''}</div>`;
          let mediaHtml = '';
          if (m.fileUrl) {
            if (m.fileType === 'image') mediaHtml = `<img src="${m.fileUrl}" class="msg-media" onclick="window.open('${m.fileUrl}')" loading="lazy">`;
            else if (m.fileType === 'video') mediaHtml = `<video src="${m.fileUrl}" class="msg-media" controls></video>`;
            else mediaHtml = `<a href="${m.fileUrl}" target="_blank" class="msg-file">📄 Скачать файл</a>`;
          }
          div.innerHTML = `${actionsHtml}<div class="message">${replyHtml}${mediaHtml}${m.text || ''} <span class="time">${m.time}</span></div>`;
          area.appendChild(div);
        });
      }
      document.querySelectorAll('.msg-actions .reply').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          replyTo = { text: btn.getAttribute('data-text'), name: allUsersData[btn.getAttribute('data-sender')]?.name || 'Пользователь' };
          document.getElementById('replyName').textContent = replyTo.name;
          document.getElementById('replyText').textContent = replyTo.text;
          document.getElementById('replyPreview').classList.add('active');
          document.getElementById('msgInput').focus();
        };
      });
      document.querySelectorAll('.msg-actions .delete').forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); remove(ref(db, 'messages/' + activeChatId + '/' + btn.getAttribute('data-id'))); };
      });
      if (isScrolledToBottom) setTimeout(() => area.scrollTop = area.scrollHeight, 50);
      if (currentCount > lastMsgCount && lastMsgCount !== 0) {
        const lastMsg = Object.values(msgs || {}).pop();
        if (lastMsg && lastMsg.sender !== currentUser.uid) { playSound(); sendNotification(friendName, lastMsg.text || 'Медиафайл'); }
      }
      lastMsgCount = currentCount;
    });

    onValue(ref(db, 'typing/' + activeChatId), (snap) => {
      const data = snap.val() || {};
      document.getElementById('typingIndicator').style.display = (data[activeFriend] === true) ? 'block' : 'none';
    });
  }

  const msgInput = document.getElementById('msgInput');
  msgInput.addEventListener('input', () => {
    if (!activeChatId) return;
    set(ref(db, 'typing/' + activeChatId + '/' + currentUser.uid), true);
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => set(ref(db, 'typing/' + activeChatId + '/' + currentUser.uid), false), 1500);
  });

  document.getElementById('closeReply').onclick = () => { replyTo = null; document.getElementById('replyPreview').classList.remove('active'); };
  document.getElementById('sendBtn').onclick = () => sendMsg();
  msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });

  document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file || !activeChatId) return;
    if (file.size > 20 * 1024 * 1024) { alert("Файл слишком большой! Максимум 20 МБ."); return; }
    const btn = document.getElementById('attachBtn');
    btn.innerText = "⏳"; btn.disabled = true;
    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.secure_url) {
        let type = 'file';
        if (file.type.startsWith('image/')) type = 'image';
        else if (file.type.startsWith('video/')) type = 'video';
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        const msgData = { sender: currentUser.uid, text: '', time: time, fileUrl: data.secure_url, fileType: type };
        if (replyTo) { msgData.replyTo = replyTo; replyTo = null; document.getElementById('replyPreview').classList.remove('active'); }
        push(ref(db, 'messages/' + activeChatId), msgData);
      } else { alert("Ошибка Cloudinary: " + (data.error?.message || 'Проверь настройки')); }
    } catch (error) { alert("Ошибка при загрузке."); } finally { btn.innerText = "📎"; btn.disabled = false; e.target.value = ''; }
  };

  function sendMsg() {
    const text = msgInput.value.trim();
    if (!text || !activeChatId) return;
    msgInput.value = '';
    set(ref(db, 'typing/' + activeChatId + '/' + currentUser.uid), false);
    const now = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    const msgData = { sender: currentUser.uid, text: text, time: time };
    if (replyTo) { msgData.replyTo = replyTo; replyTo = null; document.getElementById('replyPreview').classList.remove('active'); }
    push(ref(db, 'messages/' + activeChatId), msgData);
  }

  document.getElementById('emojiBtn').onclick = () => document.getElementById('emojiPanel').classList.toggle('active');
  document.querySelectorAll('.emoji-panel span').forEach(span => {
    span.onclick = () => { msgInput.value += span.textContent; msgInput.focus(); document.getElementById('emojiPanel').classList.remove('active'); };
  });

  document.getElementById('myAvatar').onclick = () => {
    document.getElementById('profileModal').classList.add('active');
    const u = allUsersData[currentUser.uid] || {};
    document.getElementById('settingsName').value = u.name || '';
    document.getElementById('settingsStatus').value = u.status || '';
    document.getElementById('profileName').textContent = u.name || 'Пользователь';
  };

  document.getElementById('saveProfileBtn').onclick = () => {
    const newName = document.getElementById('settingsName').value.trim();
    const newStatus = document.getElementById('settingsStatus').value.trim();
    if (newName.length < 2) return alert("Ник от 2 символов");
    update(ref(db, 'users/' + currentUser.uid), { name: newName, status: newStatus || 'В сети' }).then(() => {
      document.getElementById('profileModal').classList.remove('active');
    });
  };

  document.getElementById('closeProfileModal').onclick = () => document.getElementById('profileModal').classList.remove('active');

  document.getElementById('openAdminBtn').onclick = () => {
    document.getElementById('adminModal').classList.add('active');
    document.getElementById('adminAuthSection').style.display = 'block';
    document.getElementById('adminContentSection').style.display = 'none';
    document.getElementById('adminPasswordInput').value = '';
  };

  document.getElementById('adminLoginBtn').onclick = () => {
    const pass = document.getElementById('adminPasswordInput').value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('adminAuthSection').style.display = 'none';
      document.getElementById('adminContentSection').style.display = 'block';
      renderAdminUserList();
    } else { alert("Неверный пароль!"); }
  };

  function renderAdminUserList() {
    const list = document.getElementById('adminUserList');
    list.innerHTML = '';
    Object.keys(allUsersData).forEach(uid => {
      const u = allUsersData[uid];
      const div = document.createElement('div');
      div.className = 'admin-user-item';
      div.innerHTML = `<span>${u.name}</span> <button onclick="deleteUser('${uid}')">Удалить</button>`;
      list.appendChild(div);
    });
  }

  window.deleteUser = (uid) => {
    if (confirm('Удалить аккаунт навсегда?')) remove(ref(db, 'users/' + uid));
  };

  document.getElementById('closeAdminModal').onclick = () => document.getElementById('adminModal').classList.remove('active');

  document.getElementById('backBtn').onclick = () => {
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('noChat').style.display = 'flex';
    document.getElementById('chatHeader').style.display = 'none';
    document.getElementById('messagesArea').style.display = 'none';
    document.getElementById('inputContainer').style.display = 'none';
    document.getElementById('typingIndicator').style.display = 'none';
    activeFriend = null; activeChatId = null; lastMsgCount = 0;
    if (unsubscribeMessages) unsubscribeMessages();
    if (unsubscribeTyping) unsubscribeTyping();
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.getElementById('profileModal').classList.remove('active');
      document.getElementById('adminModal').classList.remove('active');
      document.getElementById('emojiPanel').classList.remove('active');
      document.getElementById('replyPreview').classList.remove('active');
      replyTo = null;
    }
  });
</script>
</body>
