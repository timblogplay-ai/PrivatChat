<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TmChat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1621; --sidebar-bg: #17212b; --chat-bg: #0e1621;
    --my-msg: #2b5278; --his-msg: #182533; --accent: #5288c1;
    --text: #ffffff; --text-muted: #7f91a4; --border: #101921;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  .auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { background: var(--sidebar-bg); padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
  .auth-box h2 { margin-bottom: 10px; font-size: 24px; }
  .auth-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
  .google-btn { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: #333; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
  .google-btn:hover { background: #f0f0f0; }
  .google-btn img { width: 20px; height: 20px; }
  .error-msg { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; }

  .app-container { display: none; width: 100%; height: 100%; }
  .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-header h1 { font-size: 20px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-info img { width: 32px; height: 32px; border-radius: 50%; }
  .user-info span { font-size: 14px; color: var(--text-muted); }
  .logout-btn { background: transparent; border: none; color: #ef4444; font-weight: 600; cursor: pointer; font-size: 13px; }

  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
  .chat-item:hover { background: #202b36; }
  .chat-avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; background: #2b5278; }

  .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
  .chat-header { padding: 15px 20px; background: var(--sidebar-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
  .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

  .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; position: relative; }
  .message.my { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 4px; }
  .message.his { align-self: flex-start; background: var(--his-msg); border-bottom-left-radius: 4px; }
  .message .time { font-size: 11px; color: rgba(255,255,255,0.5); float: right; margin: 5px 0 -5px 10px; }

  .input-area { padding: 15px 20px; background: var(--sidebar-bg); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-area input { flex: 1; background: #242f3d; border: none; border-radius: 20px; padding: 12px 20px; color: #fff; outline: none; }
  .input-area button { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; }

  .back-btn { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
  .no-chat { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted); }

  @media (max-width: 768px) {
    .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
    .sidebar.hidden { transform: translateX(-100%); }
    .main-chat { width: 100%; }
    .back-btn { display: block; }
  }
</style>
</head>
<body>

  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>Добро пожаловать в TmChat</h2>
      <p>Войди через Google, чтобы начать общение</p>
      <button class="google-btn" id="googleLoginBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Войти через Google
      </button>
      <div class="error-msg" id="authError"></div>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>TmChat</h1>
        <div class="user-info">
          <img id="myAvatar" src="" alt="Avatar">
          <span id="myName"></span>
          <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-chat" id="mainChat">
      <div class="no-chat" id="noChat">Выбери друга, чтобы начать общение</div>
      <div class="chat-header" id="chatHeader" style="display:none;">
        <button class="back-btn" id="backBtn">←</button>
        <div class="chat-avatar" id="headerAvatar"></div>
        <h2 id="headerName"></h2>
      </div>
      <div class="messages-area" id="messagesArea" style="display:none;"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <input type="text" id="msgInput" placeholder="Написать сообщение..." autocomplete="off">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // ТВОИ КЛЮЧИ УЖЕ ВСТАВЛЕНЫ СЮДА:
  const firebaseConfig = {
    apiKey: "AIzaSyBU7JmPHXPo1j9aayKRpfhofUIXKQ7BKD8",
    authDomain: "privatchat-7b23c.firebaseapp.com",
    databaseURL: "https://privatchat-7b23c-default-rtdb.firebaseio.com",
    projectId: "privatchat-7b23c",
    storageBucket: "privatchat-7b23c.firebasestorage.app",
    messagingSenderId: "216193424935",
    appId: "1:216193424935:web:fbfa96a080d373b3253802",
    measurementId: "G-56RRH557DN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let activeChatId = null;
  let activeFriend = null;
  let unsubscribeMessages = null;

  // ВХОД ЧЕРЕЗ GOOGLE
  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      document.getElementById('authError').style.display = 'block';
      document.getElementById('authError').textContent = "Ошибка: " + error.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      
      document.getElementById('myName').textContent = user.displayName || user.email;
      document.getElementById('myAvatar').src = user.photoURL || 'https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y';
      
      set(ref(db, 'users/' + user.uid), {
        name: user.displayName || user.email,
        photo: user.photoURL
      });
      
      loadFriends();
    } else {
      currentUser = null;
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
    }
  });

  // СПИСОК ДРУЗЕЙ
  function loadFriends() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, (snapshot) => {
      const users = snapshot.val();
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      if (!users) return;

      Object.keys(users).forEach(uid => {
        if (uid === currentUser.uid) return; 
        const u = users[uid];
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.innerHTML = `
          <div class="chat-avatar" style="background: #2b5278;">${u.name[0].toUpperCase()}</div>
          <div class="chat-info"><h3>${u.name}</h3></div>
        `;
        div.onclick = () => openChat(uid, u.name);
        list.appendChild(div);
      });
    });
  }

  // ОТКРЫТИЕ ЧАТА
  function openChat(friendUid, friendName) {
    activeFriend = friendUid;
    activeChatId = [currentUser.uid, friendUid].sort().join('_');

    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('noChat').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('messagesArea').style.display = 'flex';
    document.getElementById('inputArea').style.display = 'flex';

    document.getElementById('headerName').textContent = friendName;
    document.getElementById('headerAvatar').textContent = friendName[0].toUpperCase();
    document.getElementById('msgInput').focus();

    if (unsubscribeMessages) unsubscribeMessages();

    const messagesRef = ref(db, 'messages/' + activeChatId);
    unsubscribeMessages = onValue(messagesRef, (snapshot) => {
      const msgs = snapshot.val();
      const area = document.getElementById('messagesArea');
      const isScrolledToBottom = area.scrollHeight - area.clientHeight <= area.scrollTop + 50;
      
      area.innerHTML = '';
      if (msgs) {
        Object.values(msgs).forEach(m => {
          const div = document.createElement('div');
          div.className = `message ${m.sender === currentUser.uid ? 'my' : 'his'}`;
          div.innerHTML = `${m.text} <span class="time">${m.time}</span>`;
          area.appendChild(div);
        });
      }
      if (isScrolledToBottom) area.scrollTop = area.scrollHeight;
    });
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('noChat').style.display = 'flex';
    document.getElementById('chatHeader').style.display = 'none';
    document.getElementById('messagesArea').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    activeFriend = null;
    activeChatId = null;
    if (unsubscribeMessages) unsubscribeMessages();
  });

  document.getElementById('sendBtn').addEventListener('click', sendMsg);
  document.getElementById('msgInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMsg();
  });

  function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeChatId) return;

    input.value = '';
    const now = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    push(ref(db, 'messages/' + activeChatId), {
      sender: currentUser.uid,
      text: text,
      time: time
    });
  }
</script>
</body>
  </html>
